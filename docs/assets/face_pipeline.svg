<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 940 640" width="100%" height="100%">
  <defs>
    <style>
      .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 15px; font-weight: 700; fill: #0f172a; }
      .desc { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 12px; fill: #334155; }
      .badge { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; font-size: 13px; font-weight: 700; letter-spacing: 0.5px; }
      .tag { font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace; font-size: 11px; }
      .arrow { stroke: #64748b; stroke-width: 2; fill: none; }
    </style>
    <marker id="arrowhead" markerWidth="8" markerHeight="6" refX="7" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#64748b" />
    </marker>
    <filter id="card-shadow" x="-5%" y="-5%" width="110%" height="115%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#0f172a" flood-opacity="0.06" />
    </filter>
  </defs>

  <!-- Solid White Background (No dark gaps) -->
  <rect width="940" height="640" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="2" />

  <!-- STEP 1: QUANTITATIVE PHENOTYPE VECTOR -->
  <g transform="translate(140, 25)">
    <rect width="660" height="85" rx="10" fill="#EFF6FF" stroke="#2563EB" stroke-width="2" filter="url(#card-shadow)" />
    <text x="330" y="26" text-anchor="middle" class="badge" fill="#2563EB">INPUT TRAIT DISTRIBUTIONS</text>
    <text x="330" y="50" text-anchor="middle" class="title">📊 Calibrated Phenotype Prediction Vector</text>
    <text x="330" y="70" text-anchor="middle" class="tag" fill="#1E40AF">Eye: Brown (98.4%) • Hair: Dark Brown (91.1%) • Skin: Intermediate (89.6%)</text>
  </g>

  <line x1="470" y1="110" x2="470" y2="140" class="arrow" marker-end="url(#arrowhead)" />

  <!-- STEP 2: DYNAMIC PROMPT SYNTHESIZER -->
  <g transform="translate(140, 145)">
    <rect width="660" height="150" rx="12" fill="#FAF5FF" stroke="#7C3AED" stroke-width="2" filter="url(#card-shadow)" />
    <text x="330" y="28" text-anchor="middle" class="badge" fill="#7C3AED">🧠 ALGORITHMIC PROMPT SYNTHESIZER (prompt_builder.py)</text>

    <!-- Sub-boxes inside Prompt Builder -->
    <g transform="translate(30, 45)">
      <rect width="280" height="85" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" />
      <text x="140" y="24" text-anchor="middle" class="title" font-size="13px">⚖️ Margin Thresholding</text>
      <text x="140" y="44" text-anchor="middle" class="desc" font-size="11px">Δ(Top, Runner-up) &lt; 20%</text>
      <text x="140" y="64" text-anchor="middle" class="tag" font-size="10px" fill="#6B21A8">"Brown with subtle Red tones"</text>
    </g>

    <g transform="translate(350, 45)">
      <rect width="280" height="85" rx="8" fill="#FFFFFF" stroke="#DDD6FE" stroke-width="1.5" />
      <text x="140" y="24" text-anchor="middle" class="title" font-size="13px">📸 Studio Photography Matrix</text>
      <text x="140" y="44" text-anchor="middle" class="desc" font-size="11px">8k, neutral expression, studio lighting</text>
      <text x="140" y="64" text-anchor="middle" class="tag" font-size="10px" fill="#6B21A8">Negative prompt quality filters</text>
    </g>
  </g>

  <line x1="470" y1="295" x2="470" y2="330" class="arrow" marker-end="url(#arrowhead)" />

  <!-- STEP 3: SDXL PIPELINE -->
  <g transform="translate(140, 335)">
    <rect width="660" height="150" rx="12" fill="#FFF1F2" stroke="#E11D48" stroke-width="2" filter="url(#card-shadow)" />
    <text x="330" y="28" text-anchor="middle" class="badge" fill="#E11D48">🚀 THREAD-SAFE SDXL DIFFUSION PIPELINE (generator.py)</text>

    <!-- Sub-boxes inside SDXL -->
    <g transform="translate(30, 45)">
      <rect width="280" height="85" rx="8" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" />
      <text x="140" y="24" text-anchor="middle" class="title" font-size="13px">🔒 Thread Lock Management</text>
      <text x="140" y="44" text-anchor="middle" class="desc" font-size="11px">Double-checked singleton lock</text>
      <text x="140" y="64" text-anchor="middle" class="tag" font-size="10px" fill="#9F1239">Prevents GPU VRAM concurrency race</text>
    </g>

    <g transform="translate(350, 45)">
      <rect width="280" height="85" rx="8" fill="#FFFFFF" stroke="#FECDD3" stroke-width="1.5" />
      <text x="140" y="24" text-anchor="middle" class="title" font-size="13px">🖼️ SDXL 1.0 Synthesis</text>
      <text x="140" y="44" text-anchor="middle" class="desc" font-size="11px">Precision: fp16 • Steps: 30 • Guidance: 7.0</text>
      <text x="140" y="64" text-anchor="middle" class="tag" font-size="10px" fill="#9F1239">torch.cuda.empty_cache() auto-flush</text>
    </g>
  </g>

  <line x1="470" y1="485" x2="470" y2="520" class="arrow" marker-end="url(#arrowhead)" />

  <!-- STEP 4: RESULT PORTRAIT -->
  <g transform="translate(180, 525)">
    <rect width="580" height="85" rx="10" fill="#ECFDF5" stroke="#059669" stroke-width="2.5" filter="url(#card-shadow)" />
    <text x="290" y="28" text-anchor="middle" class="badge" fill="#059669">OUTPUT ARTIFACT</text>
    <text x="290" y="52" text-anchor="middle" class="title">👤 1024x1024 Photorealistic Forensic Portrait</text>
    <text x="290" y="72" text-anchor="middle" class="desc">Forensic Facial Landmark Consistency • High-Fidelity Dermal Rendering</text>
  </g>
</svg>
